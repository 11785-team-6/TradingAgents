# Hybrid (traditional model metrics + agent) — one decision per day, 2025 (BTC).
# Run with: python -m agent_experiment.scripts.run_pilot --config agent_experiment/configs/pilot_daily_2025_hybrid.yaml

experiment_name: "daily_2025_hybrid"

symbol_agent: "BTC-USD"
symbol_deep_trading: "BTC/USDT"

test_pool_start: "2025-01-01"
test_pool_end: "2025-12-31"

pilot_windows:
  - start: "2025-01-01"
    end: "2025-12-31"

date_stride: 1

hold_position: 0.0

llm_provider: "ollama"
quick_think_llm: "qwen3:8b"
deep_think_llm: "qwen3:30b-a3b"
backend_url: "http://localhost:11434/v1"

max_debate_rounds: 1
max_risk_discuss_rounds: 1
max_retries: 3

selected_analysts:
  - market
  - news
  - fundamentals
  - model

deep_trading_artifacts_dir: "agent_experiment/model_artifacts"
# Pin one artifacts run folder to avoid cross-run mixing during tool lookup.
deep_trading_run_id: "pilot_2025"

# Default Hybrid arm: historical performance summary (not directional signals).
model_input_mode: "metrics"

# artifacts_dir: "outputs/daily_2025_hybrid"
