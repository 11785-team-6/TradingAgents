# Hybrid with directional model tool (get_model_signals) — same schedule as metrics hybrid.
# Run: python -m agent_experiment.scripts.run_pilot --config agent_experiment/configs/pilot_daily_2025_hybrid_signals.yaml

experiment_name: "ay/all_year_hybrid_signals"

symbol_agent: "BTC-USD"
symbol_deep_trading: "BTC/USDT"

test_pool_start: "2025-01-01"
test_pool_end: "2025-12-31"

pilot_windows:
  - start: "2025-01-01"
    end: "2025-12-31"

date_stride: 1

hold_position: 0.0

llm_provider: "ollama"
quick_think_llm: "qwen3:8b"
deep_think_llm: "qwen3:30b-a3b"
backend_url: "http://localhost:11434/v1"

max_debate_rounds: 1
max_risk_discuss_rounds: 1
max_retries: 3

selected_analysts:
  - market
  - news
  - fundamentals
  - model

# Same artifact root as metrics hybrid; Model analyst uses get_model_signals.
deep_trading_artifacts_dir: "agent_experiment/model_artifacts"
# Pin one artifacts run folder to avoid cross-run mixing during tool lookup.
deep_trading_run_id: "pilot_2025"
model_input_mode: "signals"

# Optional: restrict which strategy folders are queried (default = full baseline set).
# model_strategies:
#   - lstm
#   - xgboost
#   - arima_garch
#   - xgb_lstm_ensemble

# artifacts_dir: "outputs/daily_2025_hybrid_signals"
