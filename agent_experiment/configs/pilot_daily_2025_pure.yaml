# Pure agent — one BUY/SELL/HOLD per calendar day, all of 2025 (BTC only).
# Run with: python -m agent_experiment.scripts.run_pilot --config agent_experiment/configs/pilot_daily_2025_pure.yaml

experiment_name: "daily_2025_pure"

symbol_agent: "BTC-USD"
symbol_deep_trading: "BTC/USDT"

test_pool_start: "2025-01-01"
test_pool_end: "2025-12-31"

pilot_windows:
  - start: "2025-01-01"
    end: "2025-12-31"

# 1 = 每個日曆日跑一次 LLM；2 = 隔天一跑（中間日沿用上次決策，見 run_eval forward-fill）
date_stride: 1

hold_position: 0.0

llm_provider: "ollama"
quick_think_llm: "qwen3:8b"
deep_think_llm: "qwen3:30b-a3b"
backend_url: "http://localhost:11434/v1"

max_debate_rounds: 1
max_risk_discuss_rounds: 1
max_retries: 3

selected_analysts:
  - market
  - news
  - fundamentals

artifacts_dir: "outputs/daily_2025_pure"
